<style>
  :root{
    --canvas:#121316; --bg:#18191d; --surface:#1d1e22; --line:#2a2b31;
    --fg:#ececee; --muted:#9a9ba2; --accent:#d4a042; --accent2:#e6b65c; --me:#23242a;
    --r:16px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --canvas:#f7f6f3; --bg:#ffffff; --surface:#f0eee8; --line:#dfddd7;
      --fg:#1c1c1e; --muted:#5c5c62; --accent:#b8862c; --accent2:#966a1c; --me:#ece9e2;
    }
  }
  :root[data-theme="light"]{
    --canvas:#f7f6f3; --bg:#ffffff; --surface:#f0eee8; --line:#dfddd7;
    --fg:#1c1c1e; --muted:#5c5c62; --accent:#b8862c; --accent2:#966a1c; --me:#ece9e2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--canvas);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:15px;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;color:inherit}
  a{color:var(--accent2)}
  header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
  .logo{display:flex;align-items:baseline;font-weight:800;font-size:22px;letter-spacing:-.01em}
  .logo .g{background:linear-gradient(90deg,#eceef2,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo .d{width:8px;height:8px;border-radius:3px;background:linear-gradient(135deg,var(--accent2),var(--accent));margin-left:4px;align-self:center}
  .tag{font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 7px;margin-left:6px}
  .sp{flex:1}
  .ico{background:var(--surface);border:1px solid var(--line);min-width:40px;height:40px;border-radius:11px;font-size:16px;display:grid;place-items:center;padding:0 9px}
  .ico.on{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#15161a;border:0}
  #msgs{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
  #inner{display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto}
  .msg{max-width:88%;padding:11px 13px;border-radius:var(--r);line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:var(--me);border:1px solid var(--line);border-bottom-right-radius:5px}
  .gr{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:5px}
  .gr .who{color:var(--accent);font-weight:700;font-size:11px;margin-bottom:3px;display:flex;align-items:center;gap:6px}
  .gr .who .say{cursor:pointer;color:var(--muted)}
  .sys{align-self:center;color:var(--muted);font-size:12.5px;text-align:center;max-width:90%;padding:4px 8px}
  .typing{color:var(--muted);font-style:italic}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:9px 14px;border-top:1px solid var(--line);scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:8px 13px;font-size:12.5px}
  .chip:active{background:var(--me)}
  .inbar{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg);align-items:flex-end}
  #inp{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:13px;padding:12px 13px;font-size:16px;resize:none;max-height:120px;min-height:46px;outline:none}
  #inp:focus{border-color:var(--accent)}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
  .ov.show{display:flex}
  .sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;max-width:760px;width:100%;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet h2{margin:0 0 6px;font-size:18px}
  .sheet p{color:var(--muted);font-size:12.5px;margin:0 0 12px}
  .sheet label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  .sheet label.row{display:flex;gap:9px;align-items:center;color:var(--fg);font-size:14px;margin-top:14px}
  .sheet input[type=text],.sheet input:not([type]){width:100%}
  .sheet input,.sheet select{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:11px;padding:12px;font-size:16px;outline:none}
  .sheet input[type=checkbox]{width:auto}
  .btns{display:flex;gap:9px;margin-top:16px}
  .btn{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600}
  .btn.yes{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#15161a;border:0}
  .hint{color:var(--muted);font-size:11.5px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="g">grey</span><span class="d"></span></div>

  const MAT={"ा":"aa","ि":"i","ी":"ee","ु":"u","ू":"oo","े":"e","ै":"ai","ो":"o","ौ":"au"};
  const SIGN={"ं":"n","ः":"h"}, HAL="्";
  const WORDS=[["यूट्यूब","youtube"],["गूगल","google"],["जीमेल","gmail"],["विकिपीडिया","wikipedia"],["ईमेल","email"],["अमेज़न","amazon"],["मैप","map"]];
  function translit(t){ for(const [d,r] of WORDS) t=t.split(d).join(r);
    const c=[...t]; let o="";
    for(let i=0;i<c.length;i++){const ch=c[i];
      if(CONS[ch]){o+=CONS[ch];const n=c[i+1]; if(n===HAL){i++} else if(MAT[n]){o+=MAT[n];i++} else o+="a";}
      else if(VOW[ch])o+=VOW[ch]; else if(MAT[ch])o+=MAT[ch]; else if(SIGN[ch])o+=SIGN[ch]; else if(ch===HAL)continue; else o+=ch;}
    return o; }
  const norm = s => translit(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
  const enc = encodeURIComponent;
  // action 'open' -> deep link; 'ask' -> prompt Gemini
  const SKILLS=[
    {id:"yt",t:["youtube pe chalao","youtube par chalao","gaana chalao","youtube play","song chalao","youtube chalao","youtube kholo"],slot:1,act:"open",url:q=>q?`https://www.youtube.com/results?search_query=${enc(q)}`:"https://www.youtube.com",say:q=>q?`YouTube par "${q}" khol raha hun…`:"YouTube khol raha hun…"},
    {id:"google",t:["google karo","search karo","dhundo","google search","search for"],slot:1,act:"open",url:q=>`https://www.google.com/search?q=${enc(q)}`,say:q=>`Google par "${q}" khol raha hun…`},
    {id:"wiki",t:["wikipedia pe dekho","wikipedia dekho","wikipedia","wiki par"],slot:1,act:"open",url:q=>`https://en.wikipedia.org/w/index.php?search=${enc(q)}`,say:q=>`Wikipedia par "${q}"…`},
    {id:"amazon",t:["amazon pe dhundo","amazon search","amazon par"],slot:1,act:"open",url:q=>`https://www.amazon.com/s?k=${enc(q)}`,say:q=>`Amazon par "${q}"…`},
    {id:"maps",t:["raasta batao","directions","map par","kaise jaon","google maps","map kholo"],slot:1,act:"open",url:q=>`https://www.google.com/maps/search/${enc(q)}`,say:q=>`Maps par "${q}"…`},
    {id:"news",t:["aaj ki khabrein","news batao","taza khabrein","today news","khabrein"],slot:1,act:"open",url:q=>q?`https://news.google.com/search?q=${enc(q)}`:"https://news.google.com",say:q=>`Khabrein khol raha hun…`},
    {id:"translate",t:["urdu tarjuma","urdu me translate","translate to urdu","tarjuma karo"],slot:1,act:"ask",task:q=>`Is text ka saaf Roman Urdu tarjuma do:\n\n${q}`},
    {id:"summarize",t:["khulasa karo","summarize","summary do","khulasa"],slot:1,act:"ask",task:q=>`Is text ka 5 chhote Roman Urdu bullet points mein khulasa do:\n\n${q}`},
    {id:"define",t:["matlab batao","meaning batao","define","iska matlab","kya matlab"],slot:1,act:"ask",task:q=>`"${q}" ka matlab simple Roman Urdu mein, ek misaal ke saath.`},
    {id:"weather",t:["mausam kaisa","weather","mausam batao"],slot:1,act:"ask",task:q=>`${q||"mere sheher"} ka mausam aam tor par is waqt kaisa hota hai, aur agar aap ko pata ho to aaj ka — short Roman Urdu mein. Agar yaqeeni na ho to keh dena ke live weather ke liye kaunsi site dekhun.`}
  ];
  const FILLER=new Set(["ko","ka","ki","ke","par","pe","pr","me","mein","kar","karo","do","de"]);
  function matchSkill(phrase){
    const n=norm(phrase); if(!n) return null;
    let best=null;
    for(const s of SKILLS) for(const tr of s.t){
      const tn=norm(tr); let sc=0;
      if((" "+n+" ").includes(" "+tn+" ") || n.includes(tn)) sc=1;
      else { const tt=tn.split(" "), pt=new Set(n.split(" ")); const hit=tt.filter(x=>pt.has(x)).length; const f=hit/tt.length; sc=(tt.length>=2&&f<0.67)?f*0.5:f; }
      if(!best||sc>best.sc) best={s,sc,tr};
    }
    if(!best||best.sc<0.6) return null;
    let q=""; if(best.s.slot){ const ts=new Set(norm(best.tr).split(" ")); q=n.split(" ").filter(w=>!ts.has(w)&&!FILLER.has(w)).join(" ").trim(); }
    return {skill:best.s, q};
  }

  // ---- UI helpers ----
  function add(cls, text){ const d=document.createElement("div"); d.className="msg "+cls;
    if(cls==="gr"){ const who=document.createElement("div"); who.className="who";
      who.innerHTML='Grey <span class="say" title="Bol kar sunao">🔊</span>'; d.appendChild(who);
      const body=document.createElement("div"); body.textContent=text; d.appendChild(body);
      who.querySelector(".say").onclick=()=>sayOut(text);
    } else d.textContent=text;
    inner.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; }
  function sysMsg(t){ const d=document.createElement("div"); d.className="msg sys"; d.textContent=t; inner.appendChild(d); msgs.scrollTop=msgs.scrollHeight; }

  // ---- voice out ----
  function sayOut(text){ try{ if(!("speechSynthesis" in window))return; speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="ur-PK"; u.rate=1; speechSynthesis.speak(u);}catch(e){} }

  // ---- Gemini call (retry on 503/429) ----
  const SYS="You are Grey, a helpful personal assistant. Reply in simple Roman Urdu (Pakistani, Latin script), polite 'aap', short and clear, whatever language the user uses. Use plain sentences.";
  async function gemini(userText){
    if(!key){ openSettings(); return "Pehle Gemini key lagayein (⚙ se)."; }
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
    const body={ systemInstruction:{parts:[{text:SYS}]}, contents:[{role:"user",parts:[{text:userText}]}],
      generationConfig:{temperature:0.6} };
    let lastErr="";
    for(let attempt=1;attempt<=3;attempt++){
      try{
        const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body)});
        if(r.status===503||r.status===429||r.status>=500){ lastErr=`${r.status} busy`; await sleep(attempt*1200); continue; }
        const j=await r.json();
        if(!r.ok){ const m=(j&&j.error&&j.error.message)||("HTTP "+r.status);
          if(/API key/i.test(m)) return "Key sahi nahi lag rahi — ⚙ mein dobara check karein.";
          if(/not found|is not supported/i.test(m)) return `Model "${model}" nahi mila. ⚙ mein "gemini-3.8-flash" rakhein.`;
          return "Error: "+m; }
        const t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||"").join("").trim();
        return t||"(koi jawab nahi mila)";
      }catch(e){ lastErr=String(e&&e.message||e); await sleep(attempt*800); }
    }
    return `Gemini se raabta nahi ho saka (${lastErr}). Thodi der baad try karein, ya ⚙ mein model/ key check karein.`;
  }
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  // ---- send flow ----
  let busy=false;
  async function handle(text){
    text=text.trim(); if(!text||busy) return;
    add("me", text); inp.value=""; inp.style.height="auto";
    const m=matchSkill(text);
    if(m && m.skill.act==="open"){
      const link=m.skill.url(m.q);
      sysMsg((m.skill.say?m.skill.say(m.q):"Khol raha hun…"));
      try{ window.open(link,"_blank","noopener"); }catch(e){ location.href=link; }
      return;
    }
    busy=true;
    const t=add("gr","…"); t.querySelector("div:last-child")?.classList.add("typing");
    const prompt = (m && m.skill.act==="ask" && m.q) ? m.skill.task(m.q) : text;
    const ans=await gemini(prompt);
    t.remove(); const g=add("gr",ans); if(speak) sayOut(ans);
    busy=false;
  }

  // ---- voice in ----
  let rec=null, listening=false;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  $("#mic").onclick=()=>{
    if(!SR){ sysMsg("Is browser mein awaaz (mic) support nahi."); return; }
    if(listening){ rec&&rec.stop(); return; }
    rec=new SR(); rec.lang="ur-PK"; rec.interimResults=false; rec.maxAlternatives=1;
    listening=true; $("#mic").classList.add("on");
    rec.onresult=e=>{ const t=e.results[0][0].transcript; inp.value=t; };
    rec.onerror=()=>{};
    rec.onend=()=>{ listening=false; $("#mic").classList.remove("on"); if(inp.value.trim()) handle(inp.value); };
    rec.start();
  };

  // ---- wiring ----
  $("#send").onclick=()=>handle(inp.value);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); handle(inp.value);} });
  inp.addEventListener("input",()=>{ inp.style.height="auto"; inp.style.height=Math.min(inp.scrollHeight,120)+"px"; });
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ inp.value=c.dataset.s; inp.focus(); });
  $("#bVoice").onclick=()=>{ speak=!speak; LS.set("grey.speak",speak?"1":"0"); $("#bVoice").classList.toggle("on",speak);
    sysMsg(speak?"Awaaz on: jawab bol kar bhi aayenge.":"Awaaz off."); };
  $("#bVoice").classList.toggle("on",speak);

  // ---- settings sheet ----
  const sov=$("#sov");
  function openSettings(){ $("#sKey").value=key; $("#sModel").value=model; $("#sTheme").value=LS.get("grey.theme","system");
    $("#sSpeak").checked=speak; sov.classList.add("show"); }
  $("#bSet").onclick=openSettings;
  $("#sClose").onclick=()=>sov.classList.remove("show");
  $("#sSave").onclick=()=>{ key=$("#sKey").value.trim(); model=$("#sModel").value.trim()||"gemini-3.8-flash";
    speak=$("#sSpeak").checked; const th=$("#sTheme").value;
    LS.set("grey.key",key); LS.set("grey.model",model); LS.set("grey.speak",speak?"1":"0"); LS.set("grey.theme",th);
    applyTheme(th); $("#bVoice").classList.toggle("on",speak); sov.classList.remove("show");
    sysMsg(key?"Key save ho gayi. Ab baat karein ya koi skill chalayein.":"Key khali hai — ⚙ se laga lein."); };
  sov.addEventListener("click",e=>{ if(e.target===sov) sov.classList.remove("show"); });

  // ---- greeting ----
  if(!key){ add("gr","Assalam-o-alaikum! Main Grey hun. Pehle ⚙ se apni Gemini key lagayein, phir baat-cheet, skills (YouTube/Google/tarjuma/khulasa) aur awaaz — sab is phone par. Key sirf is browser mein rehti hai."); }
  else { add("gr","Wapas aane ka shukriya! Kya karun? (chip dabayein, likhein, ya 🎤 bol kar)"); }
})();
</script>
</body>
